kind = "web"
previewPath = "/"
title = "Playa AI Foundation"
version = "1.0.0"
id = "artifacts/playa-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24278

[services.development]
run = "pnpm --filter @workspace/playa-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/playa-ai", "run", "build" ]
publicDir = "artifacts/playa-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24278"
BASE_PATH = "/"
