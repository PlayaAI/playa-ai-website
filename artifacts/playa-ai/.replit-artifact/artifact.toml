kind = "web"
previewPath = "/"
title = "Playa AI Foundation"
version = "1.0.0"
id = "artifacts/playa-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24278

[services.development]
run = "pnpm --filter @workspace/playa-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/playa-ai", "run", "build" ]
publicDir = "artifacts/playa-ai/dist/public"
serve = "static"

# Route-specific rewrites — both non-trailing-slash and trailing-slash forms
# for every prerendered sub-route, ordered before the catch-all.
#
# Why both forms:
#   - from="/work"  covers the canonical non-trailing-slash URL
#   - from="/work/" covers browsers/links that append a trailing slash
# Replit's static server applies rewrites before directory-index lookup,
# so without these the catch-all intercepts and returns the homepage HTML.
#
# Query-string requests (e.g. /work?ref=test) are handled automatically:
# path matching ignores query strings, so from="/work" already covers them.

[[services.production.rewrites]]
from = "/work"
to = "/work/index.html"

[[services.production.rewrites]]
from = "/work/"
to = "/work/index.html"

[[services.production.rewrites]]
from = "/events"
to = "/events/index.html"

[[services.production.rewrites]]
from = "/events/"
to = "/events/index.html"

[[services.production.rewrites]]
from = "/team"
to = "/team/index.html"

[[services.production.rewrites]]
from = "/team/"
to = "/team/index.html"

[[services.production.rewrites]]
from = "/manifesto"
to = "/manifesto/index.html"

[[services.production.rewrites]]
from = "/manifesto/"
to = "/manifesto/index.html"

[[services.production.rewrites]]
from = "/eelp"
to = "/eelp/index.html"

[[services.production.rewrites]]
from = "/eelp/"
to = "/eelp/index.html"

[[services.production.rewrites]]
from = "/living-trust-framework"
to = "/living-trust-framework/index.html"

[[services.production.rewrites]]
from = "/living-trust-framework/"
to = "/living-trust-framework/index.html"

[[services.production.rewrites]]
from = "/playa-ai-living-trust-framework"
to = "/playa-ai-living-trust-framework/index.html"

[[services.production.rewrites]]
from = "/playa-ai-living-trust-framework/"
to = "/playa-ai-living-trust-framework/index.html"

[[services.production.rewrites]]
from = "/privacy-toolkit"
to = "/privacy-toolkit/index.html"

[[services.production.rewrites]]
from = "/privacy-toolkit/"
to = "/privacy-toolkit/index.html"

[[services.production.rewrites]]
from = "/classic"
to = "/classic/index.html"

[[services.production.rewrites]]
from = "/classic/"
to = "/classic/index.html"

[[services.production.rewrites]]
from = "/classic/work"
to = "/classic/work/index.html"

[[services.production.rewrites]]
from = "/classic/work/"
to = "/classic/work/index.html"

[[services.production.rewrites]]
from = "/classic/events"
to = "/classic/events/index.html"

[[services.production.rewrites]]
from = "/classic/events/"
to = "/classic/events/index.html"

[[services.production.rewrites]]
from = "/classic/team"
to = "/classic/team/index.html"

[[services.production.rewrites]]
from = "/classic/team/"
to = "/classic/team/index.html"

# Catch-all SPA fallback — fires only for paths not matched above.
# Client-side wouter handles unknown paths with branded 404 UI,
# noindex/nofollow, and no canonical.
[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24278"
BASE_PATH = "/"
