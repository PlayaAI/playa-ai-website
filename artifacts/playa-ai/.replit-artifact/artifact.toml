kind = "web"
previewPath = "/"
title = "Playa AI Foundation"
version = "1.0.0"
id = "artifacts/playa-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24278

[services.development]
run = "pnpm --filter @workspace/playa-ai run dev"

# Production build — runs before the server starts.
[services.production.build]
args = ["pnpm", "--filter", "@workspace/playa-ai", "run", "build"]

# Production server — Node.js HTTP server that serves dist/public/ with
# semantically correct HTTP statuses (200 for known routes, 308 for /privacy,
# 404 for unknown routes). Replaces the previous static-file serve mode.
#
# Conflict removed: the earlier config used serve = "static" with publicDir
# and a catch-all /* → /index.html rewrite. That caused Replit's built-in
# static-file layer to handle ALL requests, bypassing server.js entirely.
# Symptoms: /privacy → 200 (not 308), unknown routes → 200 (not 404),
# hashed assets → cache-control: private (not immutable).
[services.production.run]
args = ["node", "artifacts/playa-ai/server.js"]

[services.production.run.env]
PORT = "24278"
NODE_ENV = "production"

[services.env]
PORT = "24278"
BASE_PATH = "/"
